# Open WebUI + self-hosted Langfuse + self-hosted OpenCrawl. The agent server and Ollama run on the host.
# `docker compose up -d` starts all three stacks (OpenCrawl builds from the opencrawl-core submodule).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Register the agent as an OpenAI-compatible provider (no auth needed, key is a placeholder)
      OPENAI_API_BASE_URLS: http://host.docker.internal:8010/v1
      OPENAI_API_KEYS: not-needed
      ENABLE_OPENAI_API: "true"
      WEBUI_AUTH: "false"          # single-user local dev; remove for multi-user
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - 127.0.0.1:3030:3030
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/postgres
      SALT: ${SALT:?set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH:?set in .env}
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:${LANGFUSE_WEB_PORT:-3001}:3000
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:?set in .env}
      --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?set in .env}
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  # ---- OpenCrawl (self-hosted agent session capture, search and board) -------
  # Built from the pinned opencrawl-core submodule (deploy/compose.yaml adapted,
  # SQLite FTS5 search instead of OpenSearch, no Airbyte). UI: http://localhost:8092
  opencrawl-app: &opencrawl-runtime
    build: {context: ./opencrawl-core, dockerfile: deploy/Dockerfile}
    image: opencrawl-core:${OPENCRAWL_IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 45s
    volumes: ["opencrawl_application:/data"]
    command: ["node", "dist/src/selfhost/server.mjs"]
    environment: &opencrawl-env
      HOST: 0.0.0.0
      PORT: "8092"
      OPENCRAWL_DATABASE_URL: postgres://opencrawl:${OPENCRAWL_DATABASE_PASSWORD:?set in .env}@temporal-db:5432/opencrawl
      OPENCRAWL_URL: ${OPENCRAWL_URL:-http://localhost:8092}
      OPENCRAWL_ORGANIZATION_ID: ${OPENCRAWL_ORGANIZATION_ID:?set in .env}
      OPENCRAWL_AUTH_SECRET: ${OPENCRAWL_AUTH_SECRET:?set in .env}
      OPENCRAWL_SETUP_TOKEN: ${OPENCRAWL_SETUP_TOKEN:?set in .env}
      OPENCRAWL_CONNECTOR_KEY: ${OPENCRAWL_CONNECTOR_KEY:?set in .env}
      OPENCRAWL_IDENTITY_PATH: /data/identity.sqlite
      OPENCRAWL_REGISTRY_PATH: /data/integrations.sqlite
      OPENCRAWL_SEARCH_URL: sqlite:///data/search.sqlite
      OPENCRAWL_LANDING_S3_BUCKET: opencrawl
      OPENCRAWL_LANDING_S3_REGION: us-east-1
      OPENCRAWL_LANDING_S3_ENDPOINT: http://opencrawl-s3:8333
      OPENCRAWL_LANDING_S3_ACCESS_KEY_ID: ${OPENCRAWL_S3_ACCESS_KEY_ID:?set in .env}
      OPENCRAWL_LANDING_S3_SECRET_ACCESS_KEY: ${OPENCRAWL_S3_SECRET_ACCESS_KEY:?set in .env}
      OPENCRAWL_AIRBYTE_ENABLED: "false"
      OPENCRAWL_SESSION_INDEXING_CUTOVER: "1"
      TEMPORAL_ADDRESS: opencrawl-temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_CONNECTOR_TASK_QUEUE: connector-indexing-v1
      TEMPORAL_SESSION_TASK_QUEUE: session-indexing-v1
      TEMPORAL_SESSION_DELETION_TASK_QUEUE: session-deletion-v1
    ports:
      - 127.0.0.1:${OPENCRAWL_APP_PORT:-8092}:8092
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      opencrawl-db-init: {condition: service_completed_successfully}
      opencrawl-storage-ready: {condition: service_completed_successfully}

  opencrawl-worker:
    <<: *opencrawl-runtime
    command: ["node", "dist/src/selfhost/worker.mjs"]
    environment: *opencrawl-env
    ports: []
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('fs').readFileSync('/tmp/opencrawl-worker-ready.json'));process.exit(Date.now()-Date.parse(s.checkedAt)<65000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 30
    depends_on:
      opencrawl-app: {condition: service_healthy}
      opencrawl-temporal: {condition: service_healthy}

  # Creates the app database/role next to Temporal's (script connects to host "temporal-db").
  opencrawl-db-init:
    <<: *opencrawl-runtime
    restart: "no"
    command: ["node", "deploy/database-init.mjs"]
    environment:
      OPENCRAWL_TEMPORAL_PASSWORD: ${OPENCRAWL_TEMPORAL_PASSWORD:?set in .env}
      OPENCRAWL_DATABASE_PASSWORD: ${OPENCRAWL_DATABASE_PASSWORD:?set in .env}
    volumes: []
    ports: []
    healthcheck: {disable: true}
    depends_on:
      opencrawl-db: {condition: service_healthy}

  # Waits until the bundled S3 bucket accepts signed access before the app starts.
  opencrawl-storage-ready:
    <<: *opencrawl-runtime
    restart: "no"
    command: ["node", "deploy/wait-storage.mjs"]
    environment:
      OPENCRAWL_LANDING_S3_BUCKET: opencrawl
      OPENCRAWL_LANDING_S3_REGION: us-east-1
      OPENCRAWL_LANDING_S3_ENDPOINT: http://opencrawl-s3:8333
      OPENCRAWL_LANDING_S3_ACCESS_KEY_ID: ${OPENCRAWL_S3_ACCESS_KEY_ID:?set in .env}
      OPENCRAWL_LANDING_S3_SECRET_ACCESS_KEY: ${OPENCRAWL_S3_SECRET_ACCESS_KEY:?set in .env}
    volumes: []
    ports: []
    healthcheck: {disable: true}
    depends_on:
      opencrawl-s3: {condition: service_started}

  opencrawl-s3:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: >-
      mini -dir=/data -bucket=opencrawl -admin.password=${OPENCRAWL_S3_SECRET_ACCESS_KEY:?set in .env}
      -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${OPENCRAWL_S3_ACCESS_KEY_ID:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${OPENCRAWL_S3_SECRET_ACCESS_KEY:?set in .env}
    volumes: ["opencrawl_s3:/data"]
    ports:
      - 127.0.0.1:${OPENCRAWL_S3_PORT:-18333}:8333

  # Postgres 16 shared by Temporal and the OpenCrawl app DB (separate from Langfuse's postgres).
  opencrawl-db:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    networks:
      default:
        aliases: [temporal-db]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${OPENCRAWL_TEMPORAL_PASSWORD:?set in .env}
    volumes: ["opencrawl_temporal_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 30

  opencrawl-temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${OPENCRAWL_TEMPORAL_PASSWORD:?set in .env}
      POSTGRES_SEEDS: temporal-db
      TEMPORAL_ADDRESS: opencrawl-temporal:7233
      TEMPORAL_CLI_ADDRESS: opencrawl-temporal:7233
    depends_on:
      opencrawl-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "opencrawl-temporal:7233"]
      interval: 10s
      retries: 60

volumes:
  open-webui:
  langfuse_postgres_data:
    name: langfuse_langfuse_postgres_data
  langfuse_clickhouse_data:
    name: langfuse_langfuse_clickhouse_data
  langfuse_clickhouse_logs:
    name: langfuse_langfuse_clickhouse_logs
  langfuse_minio_data:
    name: langfuse_langfuse_minio_data
  langfuse_redis_data:
    name: langfuse_langfuse_redis_data
  opencrawl_s3:
  opencrawl_temporal_db:
  opencrawl_application:
