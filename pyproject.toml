[project]
name = "you-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
you-agent = "you_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["you_agent"]

[tool.hatch.build.targets.wheel.force-include]
"you_agent/prompts" = "you_agent/prompts"
